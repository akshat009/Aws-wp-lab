name: "Terraform GitOps CI/CD"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write # Required for requesting the OIDC JWT token from GitHub
  contents: read  # Required for actions/checkout to read repo contents

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Inspect OIDC Token Claims (Debug)
      - name: Inspect OIDC Token Claims
        run: |
          TOKEN=$(curl -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" -H "User-Agent: actions/runner" -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}")
          JWT=$(echo $TOKEN | jq -r '.value')
          echo "=== Decoded OIDC JWT Payload ==="
          echo $JWT | cut -d. -f2 | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, repository_owner, ref, event_name}'

      # 3. Authenticate to AWS via OIDC (Zero Static Keys!)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::538820337783:role/GitHubActionsTerraformRole
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      # 3. Setup Terraform CLI on the runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      # 4. Initialize Terraform against Remote S3 Backend + DynamoDB Lock
      - name: Terraform Init
        run: terraform init

      # 5. Validate HCL Syntax
      - name: Terraform Validate
        run: terraform validate

      # 6. Generate Execution Plan
      - name: Terraform Plan
        run: terraform plan -no-color

      # 7. Apply Changes Automatically (Only on Merge to Main)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve

